name: Supabase Heartbeat
on:
  schedule:
    - cron: "0 12 * * *"  # every day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "https://${{ secrets.SUPABASE_URL }}/rest/v1/expediente_secuencia?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
